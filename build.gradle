buildscript {
	ext {
		springBootVersion = '3.1.5'
	}
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
	}
}

plugins {
	id 'java'
	id 'eclipse'
	id 'application'
	id 'org.springframework.boot' version '3.1.5' apply false
	id 'io.spring.dependency-management' version '1.1.3' apply false
	id 'com.diffplug.spotless' version '6.23.0' apply false
	id 'org.flywaydb.flyway' version '9.16.3' // Use the same Flyway version as in dependencies
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    // Use Java 21 as the project language level and prefer Gradle Java toolchains
    sourceCompatibility = 21
    targetCompatibility = 21

    // Configure the Java toolchain to request a Java 21 JDK for compilation and runtime tasks
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        spotless {
            java {
                target 'src/**/*.java'
                googleJavaFormat()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }

    // Ensure the compiler targets Java 21 bytecode where possible
    tasks.withType(JavaCompile) {
        options.release = 21
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly('org.projectlombok:lombok')
        annotationProcessor('org.projectlombok:lombok')
    }
}

