version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: pressing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres:5432/pressing
    depends_on:
      - postgres